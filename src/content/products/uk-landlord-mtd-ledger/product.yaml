customer:
  target: UK landlords who keep their own property income and expense records.
  problem: Property bookkeeping can become fragmented and difficult to prepare for digital reporting workflows.
  desired_outcome: Maintain orderly spreadsheet-based records ready for review and compatible bridging-software preparation.
copy:
  headline: Keep your landlord bookkeeping organised
  subheadline: A structured Excel ledger for property income and expense records.
  short_description: A practical spreadsheet system for maintaining landlord bookkeeping records during the 2026/27 tax year.
  benefits:
    - Keep income and expense records in one structured workbook.
    - Reduce time spent reorganising transactions before review.
    - Prepare spreadsheet records for use with compatible bridging software.
  features:
    - Digital download supplied after checkout.
    - 1,000 preformatted transaction rows; automatic expansion beyond 1,000 rows is not supported.
    - Joint owners enter their own reportable share; the ownership percentage is informational.
    - No direct HMRC submission or final tax calculation.
