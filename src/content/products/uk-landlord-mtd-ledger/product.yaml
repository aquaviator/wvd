how_it_works:
  - Download and open the workbook in Microsoft Excel.
  - Enter property income and expense transactions as they occur.
  - Review the summaries and prepare the records for your chosen compatible workflow.
faqs:
  - question: Does this work with Google Sheets?
    answer: No. Google Sheets is not supported in V1. The current release is tested in Microsoft 365 Excel for Windows.
  - question: Does this submit information to HMRC?
    answer: No. It is a record-keeping workbook and does not file returns or replace compatible submission software.
disclosure: This digital download is a bookkeeping aid. It does not submit directly to HMRC, calculate final tax, or provide accounting or tax advice.
