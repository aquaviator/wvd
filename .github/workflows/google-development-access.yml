name: Google development access
on:
  workflow_dispatch:
  push:
    branches: [development/shared-factory-bootstrap]
    paths:
      - '.github/workflows/google-development-access.yml'
      - 'tools/google-development-access/**'
      - 'tools/booking-runtime/**'
      - 'tools/portal-proof/google-booking-event.mjs'
permissions:
  contents: read
concurrency:
  group: google-development-access
  cancel-in-progress: false
jobs:
  access:
    if: github.repository_id == '1347788556' && github.repository_owner_id == '78605956' && github.ref == 'refs/heads/development/shared-factory-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Check explicit access activation
        env:
          ENABLED: ${{ vars.WVD_GOOGLE_ACCESS_ENABLED }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            echo 'BLOCKED: Google IAM/API prerequisites and resource grants have not been activated.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: wvd-development
          workload_identity_provider: projects/6616382131/locations/global/workloadIdentityPools/wvd-github-development/providers/github
          service_account: wvd-development@wvd-development.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly,https://www.googleapis.com/auth/calendar.freebusy
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify granted Drive and Calendar access before live tests
        env:
          WVD_GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node tools/google-development-access/preflight.mjs tools/google-development-access/binding.json
      - name: Verify portal Calendar adapter against the live provider
        env:
          WVD_GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node tools/google-development-access/calendar-contract.mjs tools/google-development-access/binding.json
      - id: calendar_grant_auth
        name: Authorise service-account calendar-list grant inspection
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: wvd-development
          workload_identity_provider: projects/6616382131/locations/global/workloadIdentityPools/wvd-github-development/providers/github
          service_account: wvd-development@wvd-development.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/calendar.calendarlist
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify WVD Calendar writer grant without creating events
        env:
          WVD_GOOGLE_ACCESS_TOKEN: ${{ steps.calendar_grant_auth.outputs.access_token }}
        run: node tools/google-development-access/calendar-writer-preflight.mjs tools/google-development-access/binding.json
      - name: Verify synthetic event cleanup contracts before live writes
        run: node --test tools/portal-proof/tests/google-booking-event.test.mjs tools/portal-proof/tests/booking-event-rehearsal.test.mjs
      - name: Verify delegation setup preserves existing provider mappings
        run: python3 tools/google-development-access/test_delegation.py
      - id: calendar_event_auth
        name: Authorise approved Workspace booking organiser
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: wvd-development
          workload_identity_provider: projects/6616382131/locations/global/workloadIdentityPools/wvd-github-development/providers/github
          service_account: wvd-development@wvd-development.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/calendar.events
          access_token_subject: admin@wearvalleydigital.com
          create_credentials_file: false
          export_environment_variables: false
      - name: Rehearse past synthetic event and Meet with verified cleanup
        env:
          WVD_GOOGLE_ACCESS_TOKEN: ${{ steps.calendar_event_auth.outputs.access_token }}
        run: node tools/google-development-access/booking-event-rehearsal.mjs tools/google-development-access/binding.json
      - id: runtime_read_auth
        name: Authorise read-only runtime permission discovery
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: wvd-development
          workload_identity_provider: projects/6616382131/locations/global/workloadIdentityPools/wvd-github-development/providers/github
          service_account: wvd-development@wvd-development.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
          export_environment_variables: false
      - name: Report booking runtime access requirements without changing configuration
        env:
          WVD_GOOGLE_ACCESS_TOKEN: ${{ steps.runtime_read_auth.outputs.access_token }}
        run: node tools/google-development-access/booking-runtime-preflight.mjs tools/google-development-access/binding.json
      - name: Discover existing London hosting resources without provisioning
        env:
          WVD_GOOGLE_ACCESS_TOKEN: ${{ steps.runtime_read_auth.outputs.access_token }}
        run: node tools/google-development-access/hosting-discovery.mjs tools/google-development-access/binding.json
      - name: Test private deployment boundaries and provider readiness before activation
        run: node --test tools/portal-proof/tests/private-deployment.test.mjs tools/portal-proof/tests/hosting-discovery.test.mjs tools/portal-proof/tests/booking-provider-readiness.test.mjs tools/portal-proof/tests/private-http.test.mjs
      - id: private_host
        name: Prepare bounded private runtime deployment within founder authority
        env:
          WVD_GOOGLE_ACCESS_TOKEN: ${{ steps.runtime_read_auth.outputs.access_token }}
        run: node tools/booking-runtime/private-deployment.mjs prepare tools/google-development-access/binding.json
      - name: Build and upload bounded private runtime image
        id: runtime_image
        if: steps.private_host.outputs.create == 'true'
        env:
          WVD_GOOGLE_ACCESS_TOKEN: ${{ steps.runtime_read_auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          image="europe-west2-docker.pkg.dev/wvd-development/wvd-booking-runtime/booking:${GITHUB_SHA}"
          docker build -f tools/booking-runtime/Dockerfile -t "$image" .
          bytes="$(docker image inspect "$image" --format '{{.Size}}')"
          test "$bytes" -le 419430400
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$WVD_GOOGLE_ACCESS_TOKEN" | docker login -u oauth2accesstoken --password-stdin https://europe-west2-docker.pkg.dev
          docker push "$image"
          digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          printf 'image=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy private runtime and verify managed startup
        if: steps.private_host.outputs.create == 'true'
        env:
          WVD_GOOGLE_ACCESS_TOKEN: ${{ steps.runtime_read_auth.outputs.access_token }}
          RUNTIME_IMAGE: ${{ steps.runtime_image.outputs.image }}
        run: node tools/booking-runtime/private-deployment.mjs create "$RUNTIME_IMAGE" "$GITHUB_SHA"
      - id: private_http
        name: Enable authenticated network path and verify anonymous denial
        env:
          WVD_GOOGLE_ACCESS_TOKEN: ${{ steps.runtime_read_auth.outputs.access_token }}
        run: node tools/booking-runtime/private-http.mjs prepare
      - id: runtime_id_auth
        name: Issue short-lived identity token for private runtime only
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: wvd-development
          workload_identity_provider: projects/6616382131/locations/global/workloadIdentityPools/wvd-github-development/providers/github
          service_account: wvd-development@wvd-development.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: ${{ steps.private_http.outputs.url }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify authenticated runtime provider startup over HTTP
        env:
          WVD_RUNTIME_ID_TOKEN: ${{ steps.runtime_id_auth.outputs.id_token }}
          RUNTIME_URL: ${{ steps.private_http.outputs.url }}
        run: node tools/booking-runtime/private-http.mjs verify "$RUNTIME_URL"
